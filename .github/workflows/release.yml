name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  desktop:
    name: Desktop builds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Build Windows artifacts
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --x64 --publish never
      - name: Build Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Package Linux unpacked tarball
        if: runner.os == 'Linux'
        run: tar -czf dist/XQQClash-${{ github.ref_name }}-linux-x64.tar.gz -C dist linux-unpacked
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XQQClash-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xqqmake/xqqclash-web:${{ github.ref_name }}
          outputs: type=oci,dest=/tmp/xqqclash-web.tar
      - uses: actions/upload-artifact@v4
        with:
          name: XQQClash-Docker
          path: /tmp/xqqclash-web.tar

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
